services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile.backend
        image: amazon-market-backend
        container_name: amazon-market-backend
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - $HOME/.composer/:$HOME/.composer/
        environment:

                DB_HOST: mysql
                DB_DATABASE: ${DB_DATABASE}
                DB_USER: ${DB_USERNAME}
                DB_PASSWORD: ${DB_PASSWORD}

        networks:
            - amazon-market-network
        depends_on:
            - mysql
            - redis

    nginx:
        image: nginx:alpine
        container_name: amazon-market-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - amazon-market-network
        depends_on:
            - backend

    mobile_app:
        build:
            context: ./mobile_app
            dockerfile: Dockerfile
        image: amazon-market-mobile-app
        container_name: amazon-market-mobile-app
        restart: unless-stopped
        ports:
            - "3000:80"
        networks:
            - amazon-market-network


    mysql:
        image: mariadb:10.5.8
        container_name: amazon-market-db
        restart: unless-stopped
        volumes:
            - dbdata:/var/lib/mysql
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
        ports:
            - "3302:3307"
        networks:
            - amazon-market-network

#    db:
#        image: mysql:8.0
#        container_name: amazon-market-db
#        restart: unless-stopped
#        environment:
#            MYSQL_DATABASE: ${DB_DATABASE}
#            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
#            MYSQL_PASSWORD: ${DB_PASSWORD}
#            MYSQL_USER: ${DB_USERNAME}
#            MYSQL_ALLOW_EMPTY_PASSWORD: 1
#        volumes:
#            - dbdata:/var/lib/mysql
#        ports:
#            - "${DB_PORT}:3306"
#        networks:
#            - amazon-market-network


    phpmyadmin:
        image: phpmyadmin
        restart: always
        ports:
            - "8003:80"
        environment:
            - PMA_ARBITRARY=1
            - PMA_HOST=mysql
            - UPLOAD_LIMIT=64M
        networks:
            - amazon-market-network

    redis:
        image: redis:alpine
        container_name: amazon-market-redis
        restart: unless-stopped
        ports:
            - "${REDIS_PORT}:6379"
        networks:
            - amazon-market-network

    mailpit:
        image: axllent/mailpit
        container_name: amazon-market-mailpit
        restart: unless-stopped
        ports:
            - "${MAIL_PORT}:1025"
            - "8025:8025"
        networks:
            - amazon-market-network

networks:
    amazon-market-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
